[project]
name = "dvachbot"
version = "0.1.0"
description = "dvachbot / tgach.top — Telegram bot + imageboard"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
timeout = 180
pythonpath = ["."]
addopts = """
  -p no:aiohttp
  -p no:hypothesispytest
  -p no:twisted
  --continue-on-collection-errors
  -q
"""

filterwarnings = [
    # pyrogram использует deprecated asyncio.get_event_loop() без loop — шум
    "ignore::DeprecationWarning:pyrogram",
    # starlette .env файл не найден в тестовом окружении — ожидаемо
    "ignore:Config file.*not found:UserWarning:starlette",
]

log_level = "WARNING"
log_cli = false


